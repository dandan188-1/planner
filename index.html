<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="规划工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon192.png">
<meta name="theme-color" content="#5b9279">
<title>规划工作台</title>
<style>
/* ============ 基础与变量 ============ */
:root{
  /* 青瓷绿主色 + 暖米白底，低饱和养眼配色 */
  --primary:#5b9279;          /* 青瓷绿 */
  --primary-dark:#4a7a64;     /* 深青瓷 */
  --primary-light:#eaf3ee;    /* 浅青瓷底 */
  --bg:#f6f4ef;               /* 暖米白 */
  --card:#fffdf8;             /* 略带暖意的卡片白 */
  --text:#3d403b;             /* 暖墨灰 */
  --text-2:#6b6f68;           /* 中灰 */
  --text-3:#a3a69e;           /* 浅灰 */
  --border:#ece8df;           /* 米色描边 */
  --green:#5b9279;            /* 与主色统一 */
  --orange:#d99a6c;           /* 暖橙陶土 */
  --red:#c97b6e;              /* 柔砖红 */
  --purple:#8a85b4;           /* 雾紫 */
  --shadow:0 1px 3px rgba(91,146,121,.06),0 1px 2px rgba(60,64,67,.05);
  --shadow-2:0 4px 16px rgba(91,146,121,.10);
  --radius:14px;
  --radius-sm:10px;
  --nav-w:240px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px}
ul{list-style:none}

/* ============ 布局骨架：左导航 + 右内容 ============ */
.app-shell{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* 左侧导航区（常驻） */
.sidebar{
  width:var(--nav-w);flex-shrink:0;
  background:#fff;z-index:201;
  display:flex;flex-direction:column;
  box-shadow:2px 0 12px rgba(0,0,0,.06);
  border-right:1px solid var(--border);
  transition:transform .28s cubic-bezier(.4,0,.2,1),margin-left .28s;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
}
.sidebar.closed{margin-left:calc(-1 * var(--nav-w))}
.sidebar-header{
  padding:20px 18px 16px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
}
.sidebar-header .avatar{
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;
}
.sidebar-header .greet{font-size:16px;font-weight:600}
.sidebar-header .sub{font-size:12px;opacity:.85;margin-top:2px}
.nav-list{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{
  display:flex;align-items:center;gap:14px;padding:13px 22px;font-size:15px;color:var(--text);
  transition:background .15s;position:relative;cursor:pointer;
}
.nav-item:hover{background:var(--primary-light)}
.nav-item:active{background:var(--primary-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .ico svg{width:22px;height:22px;fill:currentColor}
.nav-footer{padding:14px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);text-align:center}

/* 顶栏（在右侧内容区顶部） */
.content-side{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:56px;flex-shrink:0;
  background:var(--card);color:var(--text);
  display:flex;align-items:center;padding:0 16px;
  border-bottom:1px solid var(--border);z-index:100;
  padding-top:var(--safe-top);
}
.topbar .menu-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:background .15s;margin-left:-8px;
}
.topbar .menu-btn:active{background:var(--bg)}
.topbar .menu-btn svg{width:24px;height:24px;fill:var(--text-2)}
.topbar .title{font-size:18px;font-weight:600;margin-left:4px;flex:1}
.topbar .date-now{font-size:13px;color:var(--text-3)}

/* 右侧内容主区 */
.main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(20px + var(--safe-bottom));
  background:var(--bg);
}
.page{display:none;padding:18px;animation:fade .25s;max-width:760px;margin:0 auto}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:4px;height:16px;background:var(--primary);border-radius:2px}
.section-label{font-size:13px;color:var(--text-2);margin:6px 2px 10px;font-weight:500}
.btn{padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:.15s;background:var(--primary);color:#fff}
.btn:active{transform:scale(.97)}
.btn-ghost{background:var(--primary-light);color:var(--primary)}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-block{display:block;width:100%;text-align:center}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-green{background:#eaf3ee;color:var(--green)}
.tag-orange{background:#fbf0e6;color:var(--orange)}
.tag-red{background:#f6e8e4;color:var(--red)}
.tag-purple{background:#efedf6;color:var(--purple)}

/* ============ 每日计划 ============ */
.date-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:14px}
.date-bar .arrow{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:.15s}
.date-bar .arrow:active{background:var(--border)}
.date-bar .arrow svg{width:20px;height:20px;fill:var(--text-2)}
.date-bar .date-info{text-align:center}
.date-bar .date-info .d{font-size:17px;font-weight:600}
.date-bar .date-info .w{font-size:12px;color:var(--text-3)}
.date-bar .today-tag{font-size:11px;color:var(--primary);font-weight:600}

.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-bg{stroke:var(--border)}
.ring .ring-fg{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-text .pct{font-size:22px;font-weight:700;color:var(--primary)}
.ring .ring-text .lbl{font-size:11px;color:var(--text-3)}
.ring-info{flex:1}
.ring-info .ri-title{font-size:15px;font-weight:600;margin-bottom:6px}
.ring-info .ri-stat{font-size:13px;color:var(--text-2);line-height:1.8}
.ring-info .ri-stat b{color:var(--text);font-weight:600}

.check-item{
  display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:var(--radius-sm);
  transition:background .15s;margin-bottom:6px;border:1px solid transparent;
}
.check-item:active{background:var(--bg)}
.check-item.done{background:#eaf3ee;border-color:#cfe3d6}
.check-box{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-box svg{width:16px;height:16px;fill:#fff;opacity:0;transition:.2s}
.check-item.done .check-box svg{opacity:1}
.check-item .ci-name{flex:1;font-size:15px}
.check-item.done .ci-name{color:var(--text-3);text-decoration:line-through}
.check-item .ci-ico{font-size:18px;width:28px;text-align:center}
.check-item .ci-time{font-size:12px;color:var(--text-3)}

/* ============ 记账 ============ */
.balance-card{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-2)}
.balance-card .bc-label{font-size:13px;opacity:.85}
.balance-card .bc-amt{font-size:30px;font-weight:700;margin:4px 0 12px}
.balance-card .bc-row{display:flex;gap:12px}
.balance-card .bc-cell{flex:1;background:rgba(255,255,255,.15);border-radius:10px;padding:10px}
.balance-card .bc-cell .l{font-size:11px;opacity:.85}
.balance-card .bc-cell .v{font-size:16px;font-weight:600;margin-top:2px}
.acct-tabs{display:flex;gap:8px;margin-bottom:12px}
.acct-tab{flex:1;padding:9px;border-radius:var(--radius-sm);text-align:center;font-size:14px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);transition:.15s}
.acct-tab.active{background:var(--primary);color:#fff}
.acct-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acct-form input,.acct-form select{padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;width:100%}
.acct-form input:focus,.acct-form select:focus{outline:none;border-color:var(--primary)}
.acct-form .full{grid-column:1/-1}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:var(--radius-sm);background:var(--bg);font-size:11px;color:var(--text-2);transition:.15s}
.cat-btn.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.cat-btn .e{font-size:20px}
.tx-list .tx-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-item .tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-item .tx-info{flex:1;min-width:0}
.tx-item .tx-info .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-item .tx-info .t{font-size:11px;color:var(--text-3)}
.tx-item .tx-amt{font-size:15px;font-weight:600}
.tx-item .tx-amt.in{color:var(--green)}
.tx-item .tx-amt.out{color:var(--text)}
.tx-del{font-size:18px;color:var(--text-3);padding:4px 8px}

/* ============ 阅读 ============ */
.book-overview{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.book-overview .bo-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.book-overview .bo-ring svg{transform:rotate(-90deg)}
.book-overview .bo-ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--purple)}
.book-overview .bo-info{flex:1}
.book-overview .bo-info .n{font-size:15px;font-weight:600;margin-bottom:4px}
.book-overview .bo-info .s{font-size:12px;color:var(--text-2);line-height:1.7}
.book-item{margin-bottom:12px}
.book-head{display:flex;gap:12px;align-items:flex-start}
.book-cover{width:54px;height:74px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center;padding:4px;font-weight:600;line-height:1.3}
.book-meta{flex:1;min-width:0}
.book-meta .bm-title{font-size:15px;font-weight:600;margin-bottom:3px}
.book-meta .bm-author{font-size:12px;color:var(--text-3);margin-bottom:6px}
.book-meta .bm-stat{font-size:12px;color:var(--text-2)}
.book-meta .bm-stat b{color:var(--text)}
.book-progress{height:6px;background:var(--border);border-radius:3px;margin:10px 0 8px;overflow:hidden}
.book-progress .fill{height:100%;background:linear-gradient(90deg,var(--purple),#b3aecf);border-radius:3px;transition:width .4s}
.book-actions{display:flex;gap:8px}
.book-actions .mini-btn{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:500;text-align:center;transition:.15s}
.mini-btn.add{background:#efedf6;color:var(--purple)}
.mini-btn.add:active{background:#ded9ee}
.mini-btn.done{background:#eaf3ee;color:var(--green)}
.mini-btn.done.active{background:var(--green);color:#fff}
.mini-btn.reset{background:var(--bg);color:var(--text-3)}
.book-status{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.book-status.reading{background:#fbf0e6;color:var(--orange)}
.book-status.finished{background:#eaf3ee;color:var(--green)}
.book-status.new{background:var(--bg);color:var(--text-3)}

/* ============ 英语 ============ */
.en-day-card{background:linear-gradient(135deg,#5b9279,#7eb3a0);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-2)}
.en-day-card .ed-tag{font-size:12px;opacity:.85;margin-bottom:8px}
.en-day-card .ed-en{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:6px}
.en-day-card .ed-zh{font-size:15px;opacity:.95;margin-bottom:14px}
.en-day-card .ed-speak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:7px 14px;border-radius:20px;font-size:13px}
.en-day-card .ed-speak svg{width:16px;height:16px;fill:#fff}
.en-cats{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.en-cats::-webkit-scrollbar{display:none}
.en-cat{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);white-space:nowrap}
.en-cat.active{background:var(--purple);color:#fff}
.en-phrase{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.en-phrase .ep-en{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.en-phrase .ep-en .play{width:30px;height:30px;border-radius:50%;background:#efedf6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.en-phrase .ep-en .play svg{width:15px;height:15px;fill:var(--purple)}
.en-phrase .ep-zh{font-size:13px;color:var(--text-2);margin-bottom:6px}
.en-phrase .ep-tip{font-size:12px;color:var(--text-3);background:var(--bg);padding:6px 10px;border-radius:8px;line-height:1.6}

/* ============ 热点 ============ */
.hot-tabs{display:flex;gap:8px;margin-bottom:12px}
.hot-tab{flex:1;padding:10px;border-radius:var(--radius-sm);text-align:center;font-size:14px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow)}
.hot-tab.active{background:var(--red);color:#fff}
.news-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-rank{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:#fff}
.news-rank.r1{background:#c97b6e}
.news-rank.r2{background:#d99a6c}
.news-rank.r3{background:#d9bd6c}
.news-rank.rn{background:var(--text-3)}
.news-body{flex:1;min-width:0}
.news-title{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:4px}
.news-desc{font-size:12px;color:var(--text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{font-size:11px;color:var(--text-3);margin-top:5px;display:flex;gap:8px}
.news-meta .hot{color:var(--red);font-weight:600}
.fin-item{padding:12px 0;border-bottom:1px solid var(--border)}
.fin-item:last-child{border-bottom:none}
.fin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.fin-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.fin-badge{font-size:10px;padding:1px 6px;border-radius:4px}
.fin-val{font-size:13px;color:var(--text-3)}
.fin-price{display:flex;align-items:baseline;gap:8px}
.fin-price .p{font-size:17px;font-weight:700}
.fin-price .chg{font-size:13px;font-weight:600}
.up{color:var(--red)}
.down{color:var(--green)}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty .e-ico{font-size:40px;margin-bottom:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:rgba(32,33,36,.92);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 窄屏（手机）：左侧导航折叠为可滑出抽屉，菜单按钮切换 */
@media(max-width:768px){
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:201;
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.18);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar.closed{margin-left:0} /* 抽屉模式用 transform 控制，不用 margin */
  .nav-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
    opacity:0;visibility:hidden;transition:.25s;
  }
  .nav-mask.open{opacity:1;visibility:visible}
  .topbar .menu-btn svg{fill:var(--text-2)}
  .page{padding:14px}
}
/* 大屏：内容区居中限宽，避免过宽难读 */
@media(min-width:1100px){
  :root{--nav-w:260px}
}
</style>
</head>
<body>
<div class="app-shell">

<!-- 左侧导航区 -->
<div class="nav-mask" id="navMask"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="avatar">中</div>
    <div class="greet" id="sideGreet">你好</div>
    <div class="sub" id="sideSub">规划工作台 · 让生活井井有条</div>
  </div>
  <ul class="nav-list" id="navList">
    <li class="nav-item active" data-page="plan">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm5 14a1 1 0 100 2 1 1 0 000-2zm0-12a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg></span>
      <span>每日计划</span>
    </li>
    <li class="nav-item" data-page="account">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 014 4v1h1a3 3 0 013 3v2H4V9a3 3 0 013-3h1V5a4 4 0 014-4zM4 13h16v7a3 3 0 01-3 3H7a3 3 0 01-3-3v-7zm5 2a1 1 0 100 2h6a1 1 0 100-2H9z"/></svg></span>
      <span>记账</span>
    </li>
    <li class="nav-item" data-page="read">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4V4zm16 0h-7a3 3 0 00-3 3v13a2 2 0 012-2h8V4z"/></svg></span>
      <span>阅读</span>
    </li>
    <li class="nav-item" data-page="english">

<!-- 右侧内容区 -->
<div class="content-side">
<!-- 顶栏 -->
<div class="topbar">

<!-- 主内容 -->
<main class="main" id="main">

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   工具函数
============================================================ */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const pad=n=>n<10?'0'+n:''+n;
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtCN(d){return d.getMonth()+1+'月'+d.getDate()+'日';}
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];
function todayStr(){return fmt(new Date());}
function strToDate(s){const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d);}
function addDays(s,n){const d=strToDate(s);d.setDate(d.getDate()+n);return fmt(d);}
function daysBetween(a,b){return Math.round((strToDate(b)-strToDate(a))/86400000);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

/* 日期种子：用于"每日自动更新"的轮换 */
function dateSeed(s){const[a,m,d]=s.split('-').map(Number);return a*10000+m*100+d;}

/* localStorage 封装 */
const LS={
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('存储空间不足');}}
};

/* ============================================================
   导航
============================================================ */
const PAGE_TITLES={plan:'每日计划',account:'记账',read:'阅读',english:'英语',news:'时事热点',finance:'财经热点'};
let curPage='plan';

function openNav(){$('#sidebar').classList.add('open');$('#navMask').classList.add('open');}
function closeNav(){$('#sidebar').classList.remove('open');$('#navMask').classList.remove('open');}
function isMobile(){return window.matchMedia('(max-width:768px)').matches;}
function toggleNav(){
  const sb=$('#sidebar');
  if(isMobile()){
    // 窄屏：抽屉式开关
    sb.classList.toggle('open');
    $('#navMask').classList.toggle('open',sb.classList.contains('open'));
  }else{
    // 宽屏：折叠/展开常驻侧栏
    sb.classList.toggle('closed');
  }
}
function goPage(p){
  curPage=p;
  $$('.page').forEach(el=>el.classList.remove('active'));
  $('#page-'+p).classList.add('active');
  $$('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
  $('#pageTitle').textContent=PAGE_TITLES[p];
  if(isMobile())closeNav();
  $('#main').scrollTop=0;
  // 按需渲染
  if(p==='plan')renderPlan();
  if(p==='account')renderAccount();
  if(p==='read')renderBooks();
  if(p==='english')renderEnglish();
  if(p==='news')renderNews();
  if(p==='finance')renderFinance();
}
$('#menuBtn').onclick=toggleNav;
// 切换屏幕方向时，清理可能残留的抽屉状态，避免桌面端误带 open 样式
window.matchMedia('(max-width:768px)').addEventListener('change',e=>{if(!e.matches){closeNav();$('#sidebar').classList.remove('closed');}});
$('#navMask').onclick=closeNav;
$$('#navList .nav-item').forEach(el=>el.onclick=()=>goPage(el.dataset.page));

/* 顶栏日期 */
function updateTopDate(){const d=new Date();$('#topDate').textContent=pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+WEEK[d.getDay()];const h=d.getHours();let g='晚上好';if(h<6)g='凌晨好';else if(h<11)g='早上好';else if(h<13)g='中午好';else if(h<18)g='下午好';$('#sideGreet').textContent=g+'，朋友';}
updateTopDate();setInterval(updateTopDate,60000);

/* ============================================================
   每日计划
============================================================ */
const PLAN_ITEMS=[
  {key:'english',name:'英语学习',ico:'🔤',time:'早晨 30分钟'},
  {key:'reading',name:'阅读',ico:'📖',time:'白天 30页'},
  {key:'exercise',name:'运动锻炼',ico:'🏃',time:'傍晚 40分钟'},
  {key:'sleep',name:'就寝',ico:'🌙',time:'22:30 前'}
];
let curPlanDate=todayStr();

function getPlanData(date){
  const all=LS.get('planData',{});
  if(!all[date])all[date]={english:false,reading:false,exercise:false,sleep:false};
  LS.set('planData',all);
  return all[date];
}
function setPlanItem(date,key,val){
  const all=LS.get('planData',{});
  if(!all[date])all[date]={english:false,reading:false,exercise:false,sleep:false};
  all[date][key]=val;
  LS.set('planData',all);
}
function renderPlan(){
  const d=strToDate(curPlanDate);
  $('#planDate').textContent=fmtCN(d);
  $('#planWeek').textContent=WEEK[d.getDay()];
  const today=todayStr();
  const diff=daysBetween(today,curPlanDate);
  const tag=document.querySelector('.today-tag');if(tag)tag.remove();
  if(diff===0){const el=document.createElement('span');el.className='today-tag';el.textContent='今天';$('#planDate').appendChild?0:0;$('.date-info').appendChild(el);}
  else if(diff===-1){const el=document.createElement('span');el.className='today-tag';el.textContent='昨天';$('.date-info').appendChild(el);}
  else if(diff===1){const el=document.createElement('span');el.className='today-tag';el.textContent='明天';$('.date-info').appendChild(el);}

  const data=getPlanData(curPlanDate);
  const done=PLAN_ITEMS.filter(i=>data[i.key]).length;
  const total=PLAN_ITEMS.length;
  const pct=Math.round(done/total*100);
  // 进度环
  const C=2*Math.PI*42;
  $('#ringFg').setAttribute('stroke-dasharray',C);
  $('#ringFg').setAttribute('stroke-dashoffset',C*(1-pct/100));
  $('#ringPct').textContent=pct+'%';
  $('#ringStat').innerHTML=`已完成 <b>${done}</b> / ${total} 项<br>坚持，每一天都不一样`;

  // 列表
  $('#planList').innerHTML=PLAN_ITEMS.map(it=>{
    const checked=data[it.key];
    return `<div class="check-item ${checked?'done':''}" data-key="${it.key}">
      <div class="ci-ico">${it.ico}</div>
      <div class="ci-name">${it.name}</div>
      <div class="ci-time">${it.time}</div>
      <div class="check-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    </div>`;
  }).join('');
  $$('#planList .check-item').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.key;
      const data=getPlanData(curPlanDate);
      setPlanItem(curPlanDate,k,!data[k]);
      renderPlan();
      if(!data[k])toast('打卡成功！'+PLAN_ITEMS.find(i=>i.key===k).name);
    };
  });
}
$('#prevDay').onclick=()=>{curPlanDate=addDays(curPlanDate,-1);renderPlan();};
$('#nextDay').onclick=()=>{curPlanDate=addDays(curPlanDate,1);renderPlan();};

/* ============================================================
   记账
============================================================ */
const CATS_OUT=[
  {e:'🍜',n:'餐饮'},{e:'🛒',n:'超市'},{e:'🚌',n:'交通'},{e:'🏠',n:'居家'},
  {e:'💊',n:'医疗'},{e:'👕',n:'服饰'},{e:'📱',n:'通讯'},{e:'🎬',n:'娱乐'},
  {e:'🎓',n:'教育'},{e:'🎁',n:'人情'},{e:'💧',n:'水电'},{e:'📦',n:'其他'}
];
const CATS_IN=[
  {e:'💰',n:'工资'},{e:'📈',n:'理财'},{e:'🎁',n:'红包'},{e:'💵',n:'兼职'},
  {e:'🔁',n:'退款'},{e:'📦',n:'其他'}
];
let acctType='out';
let acctCat='餐饮';

function getTx(){return LS.get('txData',[]);}
function setTx(v){LS.set('txData',v);}

function renderCatGrid(){
  const cats=acctType==='out'?CATS_OUT:CATS_IN;
  acctCat=cats[0].n;
  $('#catGrid').innerHTML=cats.map(c=>`<div class="cat-btn ${c.n===acctCat?'active':''}" data-cat="${c.n}"><span class="e">${c.e}</span><span>${c.n}</span></div>`).join('');
  $$('#catGrid .cat-btn').forEach(el=>el.onclick=()=>{
    acctCat=el.dataset.cat;
    $$('#catGrid .cat-btn').forEach(e=>e.classList.toggle('active',e===el));
  });
}
$$('.acct-tab').forEach(el=>el.onclick=()=>{
  acctType=el.dataset.type;
  $$('.acct-tab').forEach(e=>e.classList.toggle('active',e===el));
  renderCatGrid();
});
$('#acctAdd').onclick=()=>{
  const amt=parseFloat($('#acctAmt').value);
  if(!amt||amt<=0){toast('请输入有效金额');return;}
  const note=$('#acctNote').value.trim();
  const now=new Date();
  const tx={id:Date.now(),type:acctType,amt,cat:acctCat,note,date:fmt(now),time:pad(now.getHours())+':'+pad(now.getMinutes())};
  const list=getTx();list.unshift(tx);setTx(list);
  $('#acctAmt').value='';$('#acctNote').value='';
  toast((acctType==='out'?'支出':'收入')+'已记录');
  renderAccount();
};
function renderAccount(){
  const list=getTx();
  const now=new Date();const ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
  const month=list.filter(t=>t.date.startsWith(ym));
  const inc=month.filter(t=>t.type==='in').reduce((s,t)=>s+t.amt,0);
  const out=month.filter(t=>t.type==='out').reduce((s,t)=>s+t.amt,0);
  $('#balAmt').textContent='¥'+(inc-out).toFixed(2);
  $('#balIn').textContent='¥'+inc.toFixed(0);
  $('#balOut').textContent='¥'+out.toFixed(0);
  if(list.length===0){$('#txList').innerHTML='<div class="empty"><div class="e-ico">📝</div>还没有记录<br>开始第一笔记账吧</div>';return;}
  $('#txList').innerHTML=list.slice(0,30).map(t=>{
    const cat=(t.type==='out'?CATS_OUT:CATS_IN).find(c=>c.n===t.cat)||{e:'📦'};
    return `<div class="tx-item">
      <div class="tx-ico" style="background:${t.type==='out'?'#f6e8e4':'#eaf3ee'}">${cat.e}</div>
      <div class="tx-info"><div class="n">${t.note||t.cat}</div><div class="t">${t.date} ${t.time} · ${t.cat}</div></div>
      <div class="tx-amt ${t.type==='in'?'in':'out'}">${t.type==='in'?'+':'-'}¥${t.amt.toFixed(2)}</div>
      <span class="tx-del" data-id="${t.id}">×</span>
    </div>`;
  }).join('');
  $$('.tx-del').forEach(el=>el.onclick=()=>{
    const id=parseInt(el.dataset.id);
    setTx(getTx().filter(t=>t.id!==id));renderAccount();toast('已删除');
  });
}
renderCatGrid();

/* ============================================================
   阅读：6本必读
============================================================ */
const BOOKS=[
  {id:1,title:'《活着》',author:'余华',pages:240,color:'#c97b6e',total:240,desc:'一个普通人在大时代中的人生苦难史，余华代表作。'},
  {id:2,title:'《百年孤独》',author:'加西亚·马尔克斯',pages:360,color:'#8a85b4',total:360,desc:'马孔多镇布恩迪亚家族七代人的魔幻史诗。'},
  {id:3,title:'《三体》',author:'刘慈欣',pages:400,color:'#4a6b7c',total:400,desc:'中国科幻里程碑，文明与宇宙的壮阔叙事。'},
  {id:4,title:'《人类简史》',author:'尤瓦尔·赫拉利',pages:440,color:'#d99a6c',total:440,desc:'从认知革命到智人称霸地球的全景史。'},
  {id:5,title:'《心流》',author:'米哈里·契克森米哈赖',pages:280,color:'#5b9279',total:280,desc:'如何在专注中找到幸福与生命意义。'},
  {id:6,title:'《非暴力沟通》',author:'马歇尔·卢森堡',pages:200,color:'#7a9cb0',total:200,desc:'用观察、感受、需要、请求改善人际关系。'}
];
function getBookData(){
  const d=LS.get('bookData',{});
  BOOKS.forEach(b=>{if(!d[b.id])d[b.id]={read:0,finished:false};});
  LS.set('bookData',d);return d;
}
function renderBooks(){
  const d=getBookData();
  let totalRead=0,totalPages=0,finished=0;
  BOOKS.forEach(b=>{totalRead+=Math.min(d[b.id].read,b.total);totalPages+=b.total;if(d[b.id].finished)finished++;});
  const pct=Math.round(totalRead/totalPages*100);
  const C=2*Math.PI*34;
  $('#bookRing').setAttribute('stroke-dasharray',C);
  $('#bookRing').setAttribute('stroke-dashoffset',C*(1-pct/100));
  $('#bookRingT').textContent=pct+'%';
  $('#bookOverviewStat').innerHTML=`已读 <b>${totalRead}</b> / ${totalPages} 页<br>读完 <b>${finished}</b> / ${BOOKS.length} 本`;

  $('#bookList').innerHTML=BOOKS.map(b=>{
    const bd=d[b.id];const read=Math.min(bd.read,b.total);
    const p=Math.round(read/b.total*100);
    let status=`<span class="book-status ${bd.finished?'finished':(read>0?'reading':'new')}">${bd.finished?'已读完':(read>0?'阅读中':'未开始')}</span>`;
    return `<div class="card book-item">
      <div class="book-head">
        <div class="book-cover" style="background:linear-gradient(135deg,${b.color},${b.color}aa)">${b.title.replace('《','').replace('》','').slice(0,3)}</div>
        <div class="book-meta">
          <div class="bm-title">${b.title}${status}</div>
          <div class="bm-author">${b.author} · ${b.total}页</div>
          <div class="bm-stat">已读 <b>${read}</b> 页 · ${p}%</div>
        </div>
      </div>
      <div class="book-progress"><div class="fill" style="width:${p}%"></div></div>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:8px">${b.desc}</div>
      <div class="book-actions">
        <div class="mini-btn add" data-act="add" data-id="${b.id}">+10页</div>
        <div class="mini-btn done ${bd.finished?'active':''}" data-act="done" data-id="${b.id}">${bd.finished?'已读完':'读完'}</div>
        <div class="mini-btn reset" data-act="reset" data-id="${b.id}">重置</div>
      </div>
    </div>`;
  }).join('');
  $$('#bookList .mini-btn').forEach(el=>el.onclick=()=>{
    const id=parseInt(el.dataset.id);const act=el.dataset.act;
    const d=getBookData();
    if(act==='add'){d[id].read+=10;if(d[id].read>=BOOKS.find(b=>b.id===id).total){d[id].read=BOOKS.find(b=>b.id===id).total;d[id].finished=true;}LS.set('bookData',d);toast('已加10页，继续加油');}
    if(act==='done'){d[id].finished=!d[id].finished;if(d[id].finished)d[id].read=BOOKS.find(b=>b.id===id).total;LS.set('bookData',d);toast(d[id].finished?'恭喜读完一本书！':'已取消');}
    if(act==='reset'){d[id].read=0;d[id].finished=false;LS.set('bookData',d);toast('已重置');}
    renderBooks();
  });
}

/* ============================================================
   时事热点 & 财经热点
   - 新闻：实时抓取人民网 RSS（经 rss2json 转 JSON，支持浏览器跨域）
   - 行情：国内接口有 CORS 限制，纯静态无法稳定获取，标注为"示例"
   - 降级：网络失败时回退到内置内容池，保证离线可用
============================================================ */
const RSS2JSON='https://api.rss2json.com/v1/api.json?rss_url=';
const RSS_SOURCES={
  news:[
    {url:'https://www.chinanews.com.cn/rss/importnews.xml',name:'中新网·要闻'},
    {url:'https://www.chinanews.com.cn/rss/china.xml',name:'中新网·时政'},
    {url:'https://www.chinanews.com.cn/rss/world.xml',name:'中新网·国际'},
  ],
  finance:[
    {url:'https://www.chinanews.com.cn/rss/finance.xml',name:'中新网·财经'},
  ]
};
// 缓存：避免频繁请求，10 分钟刷新一次
const NEWS_CACHE={news:{data:null,t:0},finance:{data:null,t:0}};
const CACHE_TTL=10*60*1000;

function stripHTML(s){return(s||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function descBrief(s,n){s=stripHTML(s);return s.length>n?s.slice(0,n)+'…':s;}
function timeAgo(pubDate){
  try{const t=new Date(pubDate).getTime();const diff=Date.now()-t;const m=Math.floor(diff/60000);
    if(m<1)return'刚刚';if(m<60)return m+'分钟前';
    const h=Math.floor(m/60);if(h<24)return h+'小时前';
    const d=Math.floor(h/24);if(d<7)return d+'天前';
    // 超过7天显示具体日期
    const dt=new Date(pubDate);
    return(dt.getMonth()+1)+'月'+dt.getDate()+'日';
  }catch(e){return'';}
}
// 抓取 RSS（带缓存），成功回调 data，失败回调 null
function fetchRSS(type,cb){
  const now=Date.now();
  const c=NEWS_CACHE[type];
  if(c.data&&now-c.t<CACHE_TTL){cb(c.data);return;}
  const sources=RSS_SOURCES[type];
  let pending=sources.length,merged=[];
  let done=false;
  sources.forEach(src=>{
    const url=RSS2JSON+encodeURIComponent(src.url);
    fetch(url).then(r=>r.json()).then(d=>{
      if(d&&d.status==='ok'&&(d.items||[]).length){
        merged=merged.concat((d.items||[]).map(it=>({
          title:stripHTML(it.title),
          desc:descBrief(it.description,60),
          link:it.link,
          time:timeAgo(it.pubDate),
          source:src.name,
          pub:it.pubDate||'',
        })));
      }
    }).catch(()=>{}).then(()=>{
      pending--;
      if(pending===0&&!done){
        done=true;
        merged.sort((a,b)=>(b.pub||'').localeCompare(a.pub||''));
        if(merged.length){NEWS_CACHE[type]={data:merged,t:now};cb(merged);}
        else cb(null);
      }
    });
  });
}
